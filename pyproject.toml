[project]
name = "cs2-analytics-bot"
version = "0.1.0"
description = "Reproducible Counter-Strike 2 analytics Telegram bot"
requires-python = ">=3.12"
dependencies = [
  "aiogram>=3.13,<4", "SQLAlchemy>=2.0,<3", "asyncpg>=0.29", "alembic>=1.13",
  "pydantic-settings>=2.5", "httpx>=0.27", "redis>=5.0", "numpy>=2.0", "matplotlib>=3.9",
  "tenacity>=9.0", "python-json-logger>=2.0"
]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
