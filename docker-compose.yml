services:
  bot:
    build: .
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
  worker:
    build: .
    command: ["python", "-m", "app.tasks.sync"]
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cs2analytics
      POSTGRES_USER: cs2
      POSTGRES_PASSWORD: cs2
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cs2 -d cs2analytics"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
volumes:
  postgres_data:
